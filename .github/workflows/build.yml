name: build

on:
  push:
    branches: ['*.x']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...

  macos:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-14 # arm64; the DMG bundles Homebrew's arm64 tmux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: brew install tmux
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - run: scripts/build-dmg.sh
      - name: TUI binaries
        run: |
          GOARCH=arm64 go build -o dist/drupal-updater-darwin-arm64 .
          GOARCH=amd64 go build -o dist/drupal-updater-darwin-amd64 .
          mv desktop/build/bin/Drupal-Updater.dmg "dist/Drupal-Updater-${GITHUB_REF_NAME}-macos-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  linux:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm] # wails can't cross-compile, so one native runner per CPU
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - run: scripts/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.runner }}
          path: desktop/build/bin/*.tar.gz

  release:
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $v"; exit 1; }
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
